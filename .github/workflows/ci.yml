name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MOCK_LLM: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run eval (mock LLM)
        run: |
          python -m eval.run_eval --markdown >> "$GITHUB_STEP_SUMMARY"
          python -m eval.run_eval --min-accuracy 0.9

      - name: Check the bot module imports
        run: python -c "import app.bot"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-support-bot .
      - name: Smoke test inside the image
        run: docker run --rm -e MOCK_LLM=true ai-support-bot python -m app.cli "How do I reset my password?"
